name: Build and sign Windows release

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing release tag that points to the selected main commit
        required: true
        type: string
      product_version:
        description: Windows ProductVersion
        required: true
        default: "1.00"
        type: string
      file_version:
        description: Windows FileVersion
        required: true
        default: "1.00.0.0"
        type: string

permissions:
  actions: read
  contents: read

concurrency:
  group: sign-${{ inputs.release_tag }}
  cancel-in-progress: false

jobs:
  build-and-sign:
    if: vars.SIGNPATH_SUBMISSION_ENABLED == 'true' && github.ref == 'refs/heads/main'
    runs-on: windows-2022
    timeout-minutes: 90
    environment: signpath-release
    env:
      RELEASE_TAG: ${{ inputs.release_tag }}
      PRODUCT_VERSION: ${{ inputs.product_version }}
      FILE_VERSION: ${{ inputs.file_version }}
    steps:
      - name: Check out protected source
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          fetch-depth: 0
      - name: Verify release tag and commit
        shell: pwsh
        run: |
          if ($env:RELEASE_TAG -notmatch '^v[0-9]+(?:\.[0-9]+){1,3}(?:-[0-9A-Za-z.-]+)?$') {
            throw "Release tag must be a version tag such as v1.00."
          }
          if ($env:PRODUCT_VERSION -notmatch '^[0-9]+\.[0-9]{2}$') {
            throw "ProductVersion must use the form 1.00."
          }
          if ($env:FILE_VERSION -notmatch '^[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+$') {
            throw "FileVersion must use four numeric components."
          }
          git check-ref-format "refs/tags/$env:RELEASE_TAG"
          if ($LASTEXITCODE -ne 0) { throw "Invalid release tag." }
          $tagSha = git rev-list -n 1 $env:RELEASE_TAG
          if (-not $tagSha -or $tagSha -ne $env:GITHUB_SHA) {
            throw "The release tag must already point to this protected main commit."
          }
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-release.txt
      - name: Install hash-locked dependencies
        run: |
          python -m pip install --only-binary=:all: --require-hashes -r requirements-release.txt
      - name: Verify source and dependencies
        shell: pwsh
        run: |
          python -m pip check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m ruff check src tests examples
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m pytest -q
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Build unsigned one-file EXE
        shell: pwsh
        run: powershell -NoProfile -ExecutionPolicy Bypass -File tools/build_gui_exe.ps1
      - name: Verify unsigned release candidate
        shell: pwsh
        run: |
          $exe = (Resolve-Path "dist/723MangaUpscaler.exe").Path
          if ((Get-AuthenticodeSignature -LiteralPath $exe).Status -ne "NotSigned") {
            throw "The SignPath input must be unsigned."
          }
          $metadata = [Diagnostics.FileVersionInfo]::GetVersionInfo($exe)
          if ($metadata.ProductName -ne "723 Manga Upscaler" -or
              $metadata.ProductVersion -ne $env:PRODUCT_VERSION -or
              $metadata.FileVersion -ne $env:FILE_VERSION -or
              $metadata.OriginalFilename -ne "723MangaUpscaler.exe") {
            throw "Windows version metadata does not match the signing request."
          }
          function Invoke-CheckedExe([string[]]$Arguments) {
            $process = Start-Process -FilePath $exe -ArgumentList $Arguments -Wait -PassThru
            if ($process.ExitCode -ne 0) { throw "EXE diagnostic failed: $Arguments" }
          }
          New-Item -ItemType Directory -Force tmp/release-check | Out-Null
          python -m mlu.gui --check-upscale examples/synthetic_lineart.png tmp/release-check/source.png
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Invoke-CheckedExe @("--version")
          Invoke-CheckedExe @("--check-config")
          Invoke-CheckedExe @("--check-ui")
          Invoke-CheckedExe @("--check-upscale", "examples/synthetic_lineart.png", "tmp/release-check/unsigned.png")
          python -c "from PIL import Image; import numpy as np; a=np.asarray(Image.open('tmp/release-check/source.png')); b=np.asarray(Image.open('tmp/release-check/unsigned.png')); raise SystemExit(0 if np.array_equal(a,b) else 1)"
          if ($LASTEXITCODE -ne 0) { throw "Unsigned EXE pixels differ from the source build." }
      - name: Upload unsigned artifact to GitHub
        id: unsigned
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: 723MangaUpscaler-unsigned-${{ github.sha }}
          path: dist/723MangaUpscaler.exe
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
      - name: Validate SignPath configuration
        shell: pwsh
        env:
          SIGNPATH_API_TOKEN: ${{ secrets.SIGNPATH_API_TOKEN }}
          SIGNPATH_ORGANIZATION_ID: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          SIGNPATH_PROJECT_SLUG: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          SIGNPATH_SIGNING_POLICY_SLUG: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
          SIGNPATH_ARTIFACT_CONFIGURATION_SLUG: ${{ vars.SIGNPATH_ARTIFACT_CONFIGURATION_SLUG }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:SIGNPATH_API_TOKEN) -or
              [string]::IsNullOrWhiteSpace($env:SIGNPATH_ORGANIZATION_ID) -or
              [string]::IsNullOrWhiteSpace($env:SIGNPATH_PROJECT_SLUG) -or
              [string]::IsNullOrWhiteSpace($env:SIGNPATH_SIGNING_POLICY_SLUG) -or
              [string]::IsNullOrWhiteSpace($env:SIGNPATH_ARTIFACT_CONFIGURATION_SLUG)) {
            throw "Configure the protected signpath-release environment before signing."
          }
      - name: Submit SignPath signing request
        id: signpath
        uses: signpath/github-action-submit-signing-request@b9d91eadd323de506c0c81cf0c7fe7438f3360fd # v2
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
          artifact-configuration-slug: ${{ vars.SIGNPATH_ARTIFACT_CONFIGURATION_SLUG }}
          github-artifact-id: ${{ steps.unsigned.outputs.artifact-id }}
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: 3600
          output-artifact-directory: signed
          parameters: |
            productVersion: ${{ toJSON(inputs.product_version) }}
            fileVersion: ${{ toJSON(inputs.file_version) }}
      - name: Verify trusted signature and output pixels
        shell: pwsh
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass -File tools/verify_gui_signature.ps1 -Path signed/723MangaUpscaler.exe -TestTamperDetection
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $signedExe = (Resolve-Path "signed/723MangaUpscaler.exe").Path
          $process = Start-Process -FilePath $signedExe -ArgumentList @("--check-upscale", "examples/synthetic_lineart.png", "tmp/release-check/signed.png") -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "Signed EXE diagnostic failed." }
          python -c "from PIL import Image; import numpy as np; a=np.asarray(Image.open('tmp/release-check/source.png')); b=np.asarray(Image.open('tmp/release-check/signed.png')); raise SystemExit(0 if np.array_equal(a,b) else 1)"
          if ($LASTEXITCODE -ne 0) { throw "Signed EXE pixels differ from the source build." }
          Get-FileHash -LiteralPath $signedExe -Algorithm SHA256 | Format-List
      - name: Upload verified signed EXE
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: 723MangaUpscaler-${{ inputs.release_tag }}-signed
          path: signed/723MangaUpscaler.exe
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
