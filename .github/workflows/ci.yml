name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-release.txt
      - name: Install hash-locked dependencies
        run: |
          python -m pip install --only-binary=:all: --require-hashes -r requirements-release.txt
      - name: Verify dependencies
        run: python -m pip check
      - name: Lint
        run: python -m ruff check src tests examples
      - name: Test
        run: python -m pytest -q
      - name: Verify distributable license bundle
        run: python tools/collect_distribution_licenses.py build/license_bundle
      - name: Verify public sample is reproducible
        shell: pwsh
        run: |
          python examples/generate_synthetic_lineart.py
          if (git diff --exit-code -- examples/synthetic_lineart.png) { exit 0 }
          throw "The committed synthetic sample is not reproducible."
